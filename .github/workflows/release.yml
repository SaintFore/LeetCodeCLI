name: Build and release Linux binary

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]' pyinstaller
      - run: pytest -q
      - run: bash scripts/build_binary.sh
      - run: mv dist/leetcode-fsrs leetcode-fsrs-linux-x86_64
      - uses: softprops/action-gh-release@v2
        with:
          files: leetcode-fsrs-linux-x86_64
          generate_release_notes: true
